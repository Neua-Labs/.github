name: Reusable App CI

# Shared CI for Neua satellite app repos (jury-day, neua-fit-app, her-crew, …).
# Generalizes the near-identical ci.yml that each satellite copy-pasted, per
# ADR-0002 (neua-studio/docs/adr/0002-fleet-repo-topology.md). A caller adds a
# ~10-line workflow:
#
#   jobs:
#     ci:
#       uses: Neua-Labs/.github/.github/workflows/reusable-app-ci.yml@main
#       with:
#         has-functions: true
#         run-e2e: true
#       secrets:
#         NEUA_PACKAGES_TOKEN: ${{ secrets.NEUA_PACKAGES_TOKEN }}

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version for all jobs.'
        type: string
        default: '22'
      run-type-check:
        description: 'Run `pnpm type-check` before the frontend build.'
        type: boolean
        default: false
      has-functions:
        description: 'Repo has a `functions/` (npm) subpackage to type-check + bundle + test.'
        type: boolean
        default: false
      run-e2e:
        description: 'Run Playwright end-to-end tests.'
        type: boolean
        default: false
    secrets:
      NEUA_PACKAGES_TOKEN:
        description: 'GitHub PAT with read:packages — installs the private @neua-labs/* framework.'
        required: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      # @neua-labs/* are private to the org and owned by neua-studio, so the
      # built-in GITHUB_TOKEN can't read them — use a PAT with read:packages.
      # Leading newline keeps the auth line on its own line.
      - name: Authenticate to GitHub Packages
        run: printf '\n//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.NEUA_PACKAGES_TOKEN }}" >> .npmrc
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        if: ${{ inputs.run-type-check }}
        run: pnpm type-check
      - run: pnpm build
      - run: pnpm test

  functions:
    if: ${{ inputs.has-functions }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Authenticate to GitHub Packages
        run: printf '\n//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.NEUA_PACKAGES_TOKEN }}" >> .npmrc
      - run: npm ci
      - run: npm run type-check
      - run: npm run bundle
      - run: npm test

  e2e:
    if: ${{ inputs.run-e2e }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: printf '\n//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.NEUA_PACKAGES_TOKEN }}" >> .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
